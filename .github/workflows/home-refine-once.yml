name: Dopracowanie strony glownej

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  refine-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Dopracuj index i nowosci
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = text

          text = text.replace('grid-template-columns:repeat(3,minmax(0,1fr));\n  gap:8px;\n  margin-top:14px;', 'grid-template-columns:repeat(4,minmax(0,1fr));\n  gap:8px;\n  margin-top:14px;', 1)
          text = text.replace('.quick{max-width:520px}', '.quick{max-width:680px}', 1)
          text = text.replace('.familock-copy{min-width:0}\n.familock-title', '.familock-copy{min-width:0}\n.familock-actions{display:flex;align-items:center;gap:7px;flex:none}\n.familock-title', 1)
          text = text.replace('  .quick{grid-template-columns:1fr 1fr}\n  .quick a:last-child{grid-column:1/-1}\n  .familock-strip{align-items:flex-start;flex-direction:column}\n  .familock-link{width:100%}', '  .quick{grid-template-columns:1fr 1fr}\n  .familock-strip{align-items:flex-start;flex-direction:column}\n  .familock-actions{width:100%;display:grid;grid-template-columns:1fr 1fr}\n  .familock-link{width:100%}', 1)

          text = text.replace('<a class="icon-btn" href="konto.html" aria-label="Konto" title="Konto">', '<a class="icon-btn" href="konto.html" id="accountTopLink" aria-label="Konto" title="Konto">', 1)
          text = text.replace('<h1 id="heroTitle">Trzy gry. Krótko i konkretnie.</h1>\n      <p id="heroLead">Słōwko i Kłōdka czekają codziennie. Raja zmienia się raz w tygodniu. Bez instalowania i bez zbędnych ekranów.</p>', '<h1 id="heroTitle">Zagraj na Szpilplacu</h1>\n      <p id="heroLead">Codziennie czekają nowe zagadki w Słōwku i Kłōdce, a raz w tygodniu nowa Raja. Wybierz grę i sprawdź swój wynik.</p>', 1)

          old_quick = '''    <nav class="quick" aria-label="Skróty">
      <a href="ranking.html" id="quickRanking">Ranking</a>
      <a href="konto.html" id="quickAccount">Konto</a>
      <a href="nowosci.html" id="quickNews">Nowości</a>
    </nav>'''
          new_quick = '''    <nav class="quick" aria-label="Skróty">
      <a href="ranking.html" id="quickRanking">Ranking</a>
      <a href="konto.html" id="quickAccount">Konto</a>
      <a href="nowosci.html" id="quickNews">Nowości</a>
      <a href="https://buycoffee.to/wspolnotafamilocka" target="_blank" rel="noopener" id="quickCoffee" data-support-source="home-shortcut">Postaw kawę ↗</a>
    </nav>'''
          text = text.replace(old_quick, new_quick, 1)

          old_familock = '''      <a class="familock-link" href="https://www.familock.pl" target="_blank" rel="noopener" id="familockLink">familock.pl ↗</a>'''
          new_familock = '''      <div class="familock-actions">
        <a class="familock-link" href="https://www.familock.pl" target="_blank" rel="noopener" id="familockLink">familock.pl ↗</a>
        <a class="familock-link" href="https://gra.familock.pl" target="_blank" rel="noopener" id="familockGameLink">gra.familock.pl ↗</a>
      </div>'''
          text = text.replace(old_familock, new_familock, 1)

          text = text.replace('title:"Trzy gry. Krótko i konkretnie.",\n      lead:"Słōwko i Kłōdka czekają codziennie. Raja zmienia się raz w tygodniu. Bez instalowania i bez zbędnych ekranów.",', 'title:"Zagraj na Szpilplacu",\n      lead:"Codziennie czekają nowe zagadki w Słōwku i Kłōdce, a raz w tygodniu nowa Raja. Wybierz grę i sprawdź swój wynik.",', 1)
          text = text.replace('account:"Konto",\n      news:"Nowości",', 'account:"Konto",\n      loginRegister:"Zaloguj / zarejestruj",\n      news:"Nowości",\n      coffee:"Postaw kawę ↗",', 1)
          text = text.replace('title:"Trzy gry. Krotko i konkretnie.",\n      lead:"Słōwko i Kłōdka czekajom kożdy dziyń. Raja zmienio sie roz na tydziyń. Bez instalowanio i bez zbytnich ekranow.",', 'title:"Szpilej na Szpilplacu",\n      lead:"Kożdy dziyń czekajom nowe zagodki we Słōwku i Kłōdce, a roz na tydziyń nowo Raja. Wybiyr gra i sprawdź swój wynik.",', 1)
          text = text.replace('account:"Konto",\n      news:"Nowości",', 'account:"Konto",\n      loginRegister:"Zaloguj / zaregistruj",\n      news:"Nowości",\n      coffee:"Postow kawa ↗",', 1)

          marker = '''  function getLang(){
    try{return localStorage.getItem(LANG_KEY)==="szl"?"szl":"pl";}catch(e){return "pl";}
  }
  function setText(id,value){var el=document.getElementById(id);if(el)el.textContent=value;}
'''
          replacement = '''  function getLang(){
    try{return localStorage.getItem(LANG_KEY)==="szl"?"szl":"pl";}catch(e){return "pl";}
  }
  function setText(id,value){var el=document.getElementById(id);if(el)el.textContent=value;}
  function hasActiveSession(){
    try{
      var raw=localStorage.getItem("sb-xyivrakegwybwhmmcawq-auth-token");
      if(!raw)return false;
      var stored=JSON.parse(raw);
      var session=stored&&((stored.currentSession)||(stored.session)||stored);
      if(!session||!session.access_token||!session.user)return false;
      var expires=Number(session.expires_at||0);
      return !expires||(expires*1000>Date.now());
    }catch(e){return false;}
  }
  function updateAccountShortcut(p){
    var logged=hasActiveSession();
    var label=logged?p.account:p.loginRegister;
    setText("quickAccount",label);
    var top=document.getElementById("accountTopLink");
    if(top){top.setAttribute("aria-label",label);top.setAttribute("title",label);}
  }
'''
          text = text.replace(marker, replacement, 1)
          text = text.replace('    setText("quickAccount",p.account);\n    setText("quickNews",p.news);', '    updateAccountShortcut(p);\n    setText("quickNews",p.news);\n    setText("quickCoffee",p.coffee);', 1)
          text = text.replace('  bootCookies();\n})();', '  bootCookies();\n  window.addEventListener("pageshow",function(){updateAccountShortcut(copy[getLang()]);});\n  window.addEventListener("storage",function(e){if(e.key&&e.key.indexOf("sb-")===0)updateAccountShortcut(copy[getLang()]);});\n})();', 1)

          if text == old:
              print('index.html bez zmian')
          else:
              p.write_text(text, encoding='utf-8', newline='')
              print('zaktualizowano index.html')

          p = Path('nowosci.html')
          text = p.read_text(encoding='utf-8')
          old = text
          text = text.replace('''          <ul class="changes">
            <li>Cuzamen został zdjęty ze strony głównej i oznaczony jako nieaktywny</li>
            <li>strona główna została przebudowana w prostszy układ mobile-first</li>
            <li>usunięte zostały ciężkie elementy panelowe, dodatkowe boksy i nakładające się poprawki mobilne</li>
            <li>ranking, konto i nowości zostały sprowadzone do prostych skrótów, a Familock do jednego lekkiego bloku</li>
          </ul>''', '''          <ul class="changes">
            <li>Cuzamen został zdjęty ze strony głównej i oznaczony jako nieaktywny</li>
            <li>strona główna została przebudowana w prostszy układ mobile-first</li>
            <li>zostały lekkie skróty do rankingu, konta lub logowania, nowości i wsparcia projektu</li>
            <li>blok Familocka prowadzi teraz zarówno do familock.pl, jak i do gra.familock.pl</li>
          </ul>''', 1)
          text = text.replace('''          <p>Szpilplac został uproszczony tak, żeby szybciej prowadził do gry i lepiej działał na telefonach. Na głównej zostają teraz Słōwko, Kłōdka i Raja.</p>''', '''          <p>Szpilplac został uproszczony tak, żeby szybciej prowadził do gry i lepiej działał na telefonach. Na głównej zostają Słōwko, Kłōdka i Raja, ale wróciły też przydatne skróty w lżejszej formie.</p>''', 1)
          if text != old:
              p.write_text(text, encoding='utf-8', newline='')
              print('zaktualizowano nowosci.html')
          else:
              print('nowosci.html bez zmian')
          PY

      - name: Commit
        run: |
          if git diff --quiet; then
            echo "Brak zmian."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html nowosci.html
          git commit -m "Strona glowna: przywroc lekkie skroty i odswiez tresc"
          git push
