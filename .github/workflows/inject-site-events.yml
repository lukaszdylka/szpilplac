name: Jednorazowe dodanie trackera

on:
  push:
    branches: [agent/odporna-analityka-v6]

permissions:
  contents: write

jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pobierz gałąź
        uses: actions/checkout@v4
        with:
          ref: agent/odporna-analityka-v6
      - name: Ustaw Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dodaj tracker do publicznych stron
        run: node scripts/inject-site-events.mjs
      - name: Zapisz zmiany
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add slowko.html cuzamen.html klodka.html kopalnia.html na-wiyrch.html bandyta.html pong.html nowosci.html raja/index.html
          if git diff --cached --quiet; then
            echo "Brak zmian do zapisania."
          else
            git commit -m "Dodaj tracker do publicznych stron"
            git push
          fi
