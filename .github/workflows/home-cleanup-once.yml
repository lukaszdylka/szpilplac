name: Finalizacja strony głównej

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize-home:
    if: ${{ github.event.head_commit.message == 'CI: przygotuj finalizację strony głównej' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Zaktualizuj nowości i numer buildu
        run: |
          python - <<'PY'
          from pathlib import Path

          NEW_BUILD = "2026.09.11.1"
          OLD_BUILDS = ["2026.09.10.1", "2026.08.02.1", "2026.08.01.4"]

          for name in [
              "build-version.js",
              "topbar-common.js",
              "site-events.js",
              "analytics.js",
              "sw.js",
              "games-registry.js",
              "index.html",
              "nowosci.html",
          ]:
              p = Path(name)
              text = p.read_text(encoding="utf-8")
              old = text
              for version in OLD_BUILDS:
                  text = text.replace(version, NEW_BUILD)
              if text != old:
                  p.write_text(text, encoding="utf-8", newline="")
                  print("build", name)

          p = Path("nowosci.html")
          text = p.read_text(encoding="utf-8")

          if "Strona główna skupia się na trzech grach" not in text:
              text = text.replace('class="entry-card latest"', 'class="entry-card"', 1)
              marker = '    <div class="timeline">\n'
              article = '''      <article class="entry">
        <div class="dot">11 IX</div>
        <div class="entry-card latest">
          <div class="entry-meta"><span class="entry-date">11 września 2026</span><span class="tag">Strona główna</span><span class="tag">Mobile</span></div>
          <h2>Strona główna skupia się na trzech grach</h2>
          <p>Szpilplac został uproszczony tak, żeby szybciej prowadził do gry i lepiej działał na telefonach. Na głównej zostają teraz Słōwko, Kłōdka i Raja.</p>
          <ul class="changes">
            <li>Cuzamen został zdjęty ze strony głównej i oznaczony jako nieaktywny</li>
            <li>strona główna została przebudowana w prostszy układ mobile-first</li>
            <li>usunięte zostały ciężkie elementy panelowe, dodatkowe boksy i nakładające się poprawki mobilne</li>
            <li>ranking, konto i nowości zostały sprowadzone do prostych skrótów, a Familock do jednego lekkiego bloku</li>
          </ul>
          <a class="entry-link" href="index.html">Przejdź do gier →</a>
        </div>
      </article>

'''
              if marker not in text:
                  raise SystemExit("Nie znaleziono początku osi zmian w nowosci.html")
              text = text.replace(marker, marker + article, 1)
              p.write_text(text, encoding="utf-8", newline="")
              print("updated nowosci.html")

          PY

      - name: Commit
        run: |
          if git diff --quiet; then
            echo "Brak zmian."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html games-registry.js nowosci.html build-version.js topbar-common.js site-events.js analytics.js sw.js
          git commit -m "Strona główna: trzy gry i mobile-first"
          git push
