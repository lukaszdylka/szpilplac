name: Kaj to je - audit danych PRG

on:
  workflow_dispatch:
  push:
    paths:
      - "kajtoje-import.py"
      - "kajtoje-import-gml.py"
      - "ms_A04_Granice_miast.gml"
      - "kajtoje-pobierz-prg.py"
      - "kajtoje-katalog.json"
      - "kajtoje.html"
      - "kajtoje-demo.json"
      - "kajtoje-demo/**"
      - "kajtoje-test-preview.py"
      - "kajtoje-publikuj-kontury.py"
      - "kajtoje-kontury.html"
      - ".github/workflows/kajtoje-data-audit.yml"

permissions:
  contents: write

jobs:
  preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate demo fixtures and JavaScript
        run: python3 kajtoje-test-preview.py
  prg:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install GDAL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin
      - name: Download complete official A04 city layer and audit all 75
        run: |
          python3 kajtoje-pobierz-prg.py --reference-date "$(date -u +%Y-%m-%d)"
      - name: Build 75-city preview dataset
        run: python3 kajtoje-publikuj-kontury.py
      - name: Commit reviewed-outline preview data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kajtoje-kontury.json
          if git diff --cached --quiet; then
            echo "Kontury testowe bez zmian."
          else
            git commit -m "data(kajtoje): publish 75 PRG outline preview geometries"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload audit output, also on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kajtoje-prg-audit
          path: |
            kajtoje-audyt-granic.json
            kajtoje-granice-robocze.json
            kajtoje-granice-z-prg.geojson
            kajtoje-kontury.json
          if-no-files-found: warn
          retention-days: 30
