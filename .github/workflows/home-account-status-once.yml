name: Poprawki konta i przejsc miedzy grami

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/home-account-status-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Zastosuj poprawki
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          text=text.replace('var AUTH_KEY="sb-xyivrakegwybwhmmcawq-auth-token";','var AUTH_KEY="szpilplac-auth-v05";',1)
          text=text.replace('>gra.familock.pl ↗</a>','>Gra point & click ↗</a>',1)
          p.write_text(text,encoding='utf-8',newline='')

          p=Path('home-enhance.js')
          text=p.read_text(encoding='utf-8')
          marker='  document.addEventListener("szp:game-played",function(){setTimeout(renderPlayed,0);});\n'
          click='  document.addEventListener("click",function(e){\n    var t=e&&e.target;\n    if(t&&(t.id==="langPl"||t.id==="langSzl"))setTimeout(refresh,30);\n  },true);\n\n'
          if marker in text and 't.id==="langPl"||t.id==="langSzl"' not in text:
              text=text.replace(marker,click+marker,1)
          p.write_text(text,encoding='utf-8',newline='')

          p=Path('site-events.js')
          text=p.read_text(encoding='utf-8')
          marker='  function boot(){\n    installGameEventBridge();'
          lines=[
              '  function loadResultCycle(){',
              '    var path=String(location.pathname||"").toLowerCase();',
              '    var isGame=path.endsWith("/slowko.html")||path.endsWith("/klodka.html")||path==="/raja/"||path.endsWith("/raja/index.html");',
              '    if(!isGame||document.getElementById("szp-result-cycle"))return;',
              '    var script=document.createElement("script");',
              '    script.id="szp-result-cycle";',
              '    script.src="/result-cycle.js?v="+encodeURIComponent(VERSION);',
              '    script.async=false;',
              '    document.head.appendChild(script);',
              '  }',
              '',
              '  function boot(){',
              '    loadResultCycle();',
              '    installGameEventBridge();'
          ]
          replacement='\n'.join(lines)
          if marker in text and 'function loadResultCycle()' not in text:
              text=text.replace(marker,replacement,1)
          p.write_text(text,encoding='utf-8',newline='')

          p=Path('sw.js')
          text=p.read_text(encoding='utf-8')
          if '"/home-enhance.js"' not in text:
              text=text.replace('  "/game-played.js",\n','  "/game-played.js",\n  "/home-enhance.js",\n',1)
          if '"/result-cycle.js"' not in text:
              text=text.replace('  "/weekly-status.js",\n','  "/weekly-status.js",\n  "/result-cycle.js",\n',1)
          p.write_text(text,encoding='utf-8',newline='')

          p=Path('build-version.js')
          text=p.read_text(encoding='utf-8').replace('2026.09.11.1','2026.09.11.2',1)
          p.write_text(text,encoding='utf-8',newline='')

          p=Path('nowosci.html')
          text=p.read_text(encoding='utf-8')
          text=text.replace('Szpilplac został uproszczony tak, żeby szybciej prowadził do gry i lepiej działał na telefonach. Na głównej zostają Słōwko, Kłōdka i Raja, ale wróciły też przydatne skróty w lżejszej formie.','Szpilplac został uproszczony tak, żeby szybciej prowadził do gry i lepiej działał na telefonach. Na głównej zostają Słōwko, Kłōdka i Raja, a przydatne informacje o koncie i rozegranych grach wróciły w lekkiej formie.',1)
          text=text.replace('            <li>zostały lekkie skróty do rankingu, konta lub logowania, nowości i wsparcia projektu</li>','            <li>dla zalogowanego gracza wrócił mały kafelek konta; gość widzi skrót do logowania i rejestracji</li>\n            <li>status rozegrania Słōwka, Kłōdki i tygodniowej Rai jest ponownie synchronizowany z urządzeniem i kontem</li>\n            <li>po zakończeniu gry następny krok jest stały: Słōwko → Kłōdka → Raja → Słōwko</li>',1)
          text=text.replace('            <li>blok Familocka prowadzi teraz zarówno do familock.pl, jak i do gra.familock.pl</li>','            <li>Familock i gra point & click mają osobne przyciski</li>',1)
          p.write_text(text,encoding='utf-8',newline='')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html home-enhance.js site-events.js sw.js build-version.js nowosci.html
          git commit -m "Napraw konto, status gier i przejścia po wyniku"
          git push
