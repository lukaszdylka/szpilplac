name: Bump cache versions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    if: ${{ !contains(github.event.head_commit.message, 'Bump HTML cache versions') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Clean changelog wording
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('nowosci.html')
          text = p.read_text(encoding='utf-8')
          old = text
          replacements = {
              'Kamraty i publiczne profile graczy zostały wycofane. Zostają gry, konto do zapisywania wyników, ranking, rangi i odznaki — bez warstwy społecznościowej.': 'Usunięte zostały nieużywane funkcje społecznościowe. Zostają gry, konto do zapisywania wyników, ranking, rangi i odznaki — bez dodatkowej warstwy społecznościowej.',
              'usunięte Kamraty, reakcje, obserwowanie i porównywanie graczy': 'usunięte funkcje obserwowania, reakcji i porównywania graczy',
              'usunięte publiczne profile graczy i linki do nich z rankingu': 'ranking został uproszczony do listy wyników bez osobnych podstron graczy',
              'wyłączone odznaki związane wyłącznie z Kamratami, bez kasowania historycznych danych': 'wyłączone odznaki związane wyłącznie z usuniętymi funkcjami społecznościowymi, bez kasowania historycznych danych',
              'zamknięte stare mechanizmy Kamratów w tle, żeby wycofana funkcja nie działała bokiem': 'zamknięte stare mechanizmy społecznościowe w tle, żeby wycofane funkcje nie działały bokiem',
              'Po wycofaniu Kamratów posprzątane zostały również techniczne pozostałości tej funkcji i starszych etapów rozwoju.': 'Po uproszczeniu części społecznościowej posprzątane zostały również techniczne pozostałości starszych etapów rozwoju.',
              'usunięte powiadomienia o reakcjach i nowych Kamratach': 'usunięte powiadomienia związane z wycofanymi funkcjami społecznościowymi',
              'dalsze porządkowanie profilu gracza': 'dalsze porządkowanie konta gracza',
              '<span class="tag">Społeczność</span>': '<span class="tag">Konto i ranking</span>',
              'Doszli Kamraty, odznaki i strona nowości': 'Doszły odznaki i strona nowości',
              'Szpilplac przestał być wyłącznie zbiorem pojedynczych gier. Pojawiły się elementy wspólnej zabawy i miejsce opisujące rozwój projektu.': 'Szpilplac przestał być wyłącznie zbiorem pojedynczych gier. Pojawiły się odznaki, rozbudowany ranking i miejsce opisujące rozwój projektu.',
              'publiczne profile graczy i Kamraty z placu': 'rozbudowano ranking i elementy grywalizacji',
              'reakcje między graczami': 'dodano więcej elementów wspólnej rywalizacji',
          }
          for a,b in replacements.items():
              text = text.replace(a,b)
          if text != old:
              p.write_text(text, encoding='utf-8', newline='')
              print('changed nowosci.html')
          else:
              print('nothing to change')
          PY

      - name: Commit changes
        run: |
          if git diff --quiet -- nowosci.html; then
            echo "No changelog changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nowosci.html
          git commit -m "Nowości: usuń wzmianki o wycofanych profilach"
          git push
