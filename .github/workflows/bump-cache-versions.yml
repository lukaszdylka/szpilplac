name: Bump cache versions

# Utrzymuje wspólny numer buildu w skryptach i aktualizuje znane odwołania cache.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    if: ${{ !contains(github.event.head_commit.message, 'Bump HTML cache versions') && !contains(github.event.head_commit.message, 'Sync shared build versions') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Sync shared build and script query versions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          build_text = Path('build-version.js').read_text(encoding='utf-8')
          match = re.search(r'SZP_BUILD_ID="([^"]+)"', build_text)
          if not match:
              raise SystemExit('Brak SZP_BUILD_ID w build-version.js')
          build = match.group(1)

          shared_patterns = {
              'topbar-common.js': (r'FALLBACK_BUILD="[^"]+"', f'FALLBACK_BUILD="{build}"'),
              'site-events.js': (r'var VERSION=window\.SZP_BUILD_ID\|\|"[^"]+";', f'var VERSION=window.SZP_BUILD_ID||"{build}";'),
              'analytics.js': (r'var version=window\.SZP_BUILD_ID\|\|"[^"]+";', f'var version=window.SZP_BUILD_ID||"{build}";'),
              'sw.js': (r'const BUILD_ID=self\.SZP_BUILD_ID\|\|"[^"]+";', f'const BUILD_ID=self.SZP_BUILD_ID||"{build}";'),
              'games-registry.js': (r'var VERSION=window\.SZP_BUILD_ID\|\|"[^"]+";', f'var VERSION=window.SZP_BUILD_ID||"{build}";'),
          }

          changed = []
          for file, (pattern, replacement) in shared_patterns.items():
              p = Path(file)
              text = p.read_text(encoding='utf-8')
              new_text = re.sub(pattern, replacement, text, count=1)
              if new_text != text:
                  p.write_text(new_text, encoding='utf-8', newline='')
                  changed.append(file)
                  print('synced build', file, build)

          page_patterns = {
              'index.html': [
                  (r'build-version\.js\?v=[^"\']+', f'build-version.js?v={build}'),
                  (r'topbar-common\.js\?v=[^"\']+', f'topbar-common.js?v={build}'),
                  ('ôd Familocka', 'od Familocka'),
              ],
              'nowosci.html': [
                  (r'/site-events\.js\?v=[^"\']+', f'/site-events.js?v={build}'),
                  (r'<p>Szpilplac został uproszczony tak, żeby szybciej prowadził do gry i lepiej działał na telefonach\. Na głównej zostają teraz Słōwko, Kłōdka i Raja\.</p>', '<p>Szpilplac został uproszczony tak, żeby szybciej prowadził do gry i lepiej działał na telefonach. Na głównej zostają Słōwko, Kłōdka i Raja, ale wróciły też przydatne skróty w lżejszej formie.</p>'),
                  (r'<li>Cuzamen został zdjęty ze strony głównej i oznaczony jako nieaktywny</li>\s*<li>strona główna została przebudowana w prostszy układ mobile-first</li>\s*<li>usunięte zostały ciężkie elementy panelowe, dodatkowe boksy i nakładające się poprawki mobilne</li>\s*<li>ranking, konto i nowości zostały sprowadzone do prostych skrótów, a Familock do jednego lekkiego bloku</li>', '<li>Cuzamen został zdjęty ze strony głównej i oznaczony jako nieaktywny</li>\n            <li>strona główna została przebudowana w prostszy układ mobile-first</li>\n            <li>zostały lekkie skróty do rankingu, konta lub logowania, nowości i wsparcia projektu</li>\n            <li>blok Familocka prowadzi teraz zarówno do familock.pl, jak i do gra.familock.pl</li>'),
              ],
          }

          for file, patterns in page_patterns.items():
              p = Path(file)
              text = p.read_text(encoding='utf-8')
              old_text = text
              for pattern, replacement in patterns:
                  text = re.sub(pattern, replacement, text)
              if text != old_text:
                  p.write_text(text, encoding='utf-8', newline='')
                  changed.append(file)
                  print('synced page ref', file, build)

          replacements = {
              'konto.html': {
                  'achievement-toast.js?v=124': 'achievement-toast.js?v=125',
                  'achievements-panel.js?v=124': 'achievements-panel.js?v=125',
                  'google-auth-bridge.js?v=124': 'google-auth-bridge.js?v=125',
                  'game-display-names.js?v=124': 'game-display-names.js?v=125',
                  'avatar-select.js?v=124': 'avatar-select.js?v=125',
                  'konto-dashboard.js?v=124': 'konto-dashboard.js?v=039',
                  'konto-delete-bridge.js?v=124': 'konto-delete-bridge.js?v=038',
              },
              'klodka.html': {
                  'klodka-auth-bridge.js?v=80': 'klodka-auth-bridge.js?v=126',
                  'game-result-actions.js?v=80': 'game-result-actions.js?v=126',
              },
              'slowko.html': {
                  'game-result-actions.js?v=79': 'game-result-actions.js?v=126',
              },
              'raja/index.html': {
                  'raja-auth-bridge.js?v=124': 'raja-auth-bridge.js?v=125',
                  '../achievement-toast.js?v=124': '../achievement-toast.js?v=125',
                  '../game-result-actions.js?v=124': '../game-result-actions.js?v=126',
                  '../game-played.js?v=124': '../game-played.js?v=125',
                  '../game-save.js?v=124': '../game-save.js?v=125',
                  '../archive-achievement-common.js?v=124': '../archive-achievement-common.js?v=125',
              },
          }

          for file, reps in replacements.items():
              p = Path(file)
              text = p.read_text(encoding='utf-8')
              old_text = text
              for old, new in reps.items():
                  text = text.replace(old, new)
              if text != old_text:
                  p.write_text(text, encoding='utf-8', newline='')
                  changed.append(file)
                  print('changed cache ref', file)

          if not changed:
              print('nothing to commit')
          PY

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No build/cache-version changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add topbar-common.js site-events.js analytics.js sw.js games-registry.js index.html nowosci.html konto.html klodka.html slowko.html raja/index.html
          git commit -m "Sync shared build versions"
          git push
