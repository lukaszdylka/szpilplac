name: Bump cache versions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    if: ${{ !contains(github.event.head_commit.message, 'Bump HTML cache versions') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Bump script query versions
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'konto.html': {
                  '<script src="retired-achievements.js?v=1"></script>': '',
              },
              'nowosci.html': {
                  'Historia rozwoju Szpilplacu. Zobacz, kiedy pojawiały się gry, konto gracza, ranking, Kamraty, odznaki i kolejne zmiany projektu.': 'Historia rozwoju Szpilplacu. Zobacz, kiedy pojawiały się gry, konto gracza, ranking, odznaki, profile i kolejne zmiany projektu.',
                  '    <div class="timeline">\n      <article class="entry">\n        <div class="dot">8 IX</div>\n        <div class="entry-card latest">': '    <div class="timeline">\n      <article class="entry">\n        <div class="dot">10 IX</div>\n        <div class="entry-card latest">\n          <div class="entry-meta"><span class="entry-date">10 września 2026</span><span class="tag">Konto</span></div>\n          <h2>Szpilplac uprościł część społecznościową</h2>\n          <p>Kamraty z placu zostały wycofane. Zostają konto, ranking, odznaki i prosty profil publiczny gracza, bez obserwowania, reakcji i porównań.</p>\n          <ul class="changes">\n            <li>usunięte Kamraty, reakcje i porównywanie graczy</li>\n            <li>zachowany prosty profil publiczny i link z rankingu</li>\n            <li>zachowane odznaki niezwiązane z Kamratami</li>\n            <li>usunięte stare skrypty i pozostałości po dawnych poprawkach</li>\n          </ul>\n          <a class="entry-link" href="konto.html">Przejdź do konta →</a>\n        </div>\n      </article>\n\n      <article class="entry">\n        <div class="dot">8 IX</div>\n        <div class="entry-card">',
              },
          }

          changed = []
          for file, reps in replacements.items():
              p = Path(file)
              text = p.read_text(encoding='utf-8')
              old_text = text
              for old, new in reps.items():
                  text = text.replace(old, new)
              if text != old_text:
                  p.write_text(text, encoding='utf-8', newline='')
                  changed.append(file)
                  print('changed', file)
              else:
                  print('no changes', file)

          if not changed:
              print('nothing to commit')
          PY

      - name: Commit changes
        run: |
          if git diff --quiet -- konto.html nowosci.html; then
            echo "No HTML cache-version changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add konto.html nowosci.html
          git commit -m "Bump HTML cache versions"
          git push
