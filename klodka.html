*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{font-family:"Inter",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh;display:flex;flex-direction:column;align-items:center;transition:background .2s,color .2s}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
header{width:100%;max-width:480px;padding:14px 18px 4px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{font-size:12px;font-weight:600;color:var(--green);display:inline-flex;align-items:center;gap:4px}
.controls{display:flex;align-items:center;gap:7px}
.lang-tog{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface2)}
.lang-tog button{font-size:11px;font-weight:700;padding:5px 9px;color:var(--ink2)}
.lang-tog button.on{background:var(--green);color:#fff}
.icon-btn{width:32px;height:32px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.icon-btn:hover{background:var(--surface);color:var(--ink)}
.nav-bar{display:flex;align-items:center;gap:8px;margin-top:10px}
.nav-btn,.nav-cal{width:28px;height:28px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.nav-btn:hover,.nav-cal:hover{background:var(--surface);color:var(--ink)}
.nav-btn:disabled{opacity:.3;cursor:default}
.nav-day{flex:1;text-align:center;font-size:12px;font-weight:700;color:var(--ink2)}
.nav-day .dayno{font-family:"Oswald";font-size:18px;color:var(--ink);letter-spacing:.02em}
.archive-badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--gold);color:#fff;margin-left:6px}
main{width:100%;max-width:480px;padding:6px 18px 28px;flex:1;display:flex;flex-direction:column}
.title-row{display:flex;align-items:baseline;justify-content:space-between;margin:8px 2px 2px}
.title{font-family:"Oswald";font-size:30px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.pno{font-size:12px;color:var(--ink2);font-weight:700}
.tagline{font-size:12.5px;color:var(--ink2);margin:2px 2px 0}
.toast{min-height:22px;font-weight:700;font-size:13.5px;color:var(--green);text-align:center;margin:10px 0 2px;transition:opacity .2s}
.board{display:flex;flex-direction:column;gap:8px;align-items:center;margin:8px 0 4px}
.repeat-info{min-height:22px;text-align:center;font-size:12px;color:var(--ink2);font-weight:700;margin:2px 0 4px;letter-spacing:.02em}
.repeat-info b{color:var(--green)}
.row{display:flex;gap:8px}
.tile{width:54px;height:54px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:"Oswald";font-size:30px;color:var(--ink);background:var(--surface2);border:2px solid var(--line);transition:transform .08s}
.tile.filled{border-color:var(--ink2);animation:pop .1s}
.tile.correct{background:var(--correct);border-color:var(--correct);color:#fff}
.tile.present{background:var(--present);border-color:var(--present);color:#fff}
.tile.absent{background:var(--absent);border-color:var(--absent);color:#fff}
.tile.dir-higher,.tile.dir-lower{position:relative;overflow:hidden}
.tile.dir-higher::after,.tile.dir-lower::after{position:absolute;right:5px;bottom:3px;font-family:"Inter",system-ui,sans-serif;font-size:16px;font-weight:900;line-height:1;color:#fff;opacity:.98;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.tile.dir-higher::after{content:"↑"}
.tile.dir-lower::after{content:"↓"}
.tile.reveal{animation:flip .4s ease forwards}
.row.shake{animation:shake .35s}

@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:300px;margin:14px auto 0;width:100%}
.key{height:54px;border-radius:11px;background:var(--surface2);border:1px solid var(--line);font-family:"Oswald";font-size:24px;color:var(--ink);display:flex;align-items:center;justify-content:center;transition:transform .06s,background .1s}
.key:active{transform:scale(.94)}
.key.wide{font-family:"Inter";font-size:14px;font-weight:800;letter-spacing:.02em}
.key.enter{background:var(--green);color:#fff;border-color:var(--green)}
.key.del{color:var(--ink2)}
.key.correct{background:var(--correct);border-color:var(--correct);color:#fff}
.key.present{background:var(--present);border-color:var(--present);color:#fff}
.key.absent{background:var(--absent);border-color:var(--absent);color:#fff}
.cal-scrim{position:fixed;inset:0;z-index:60;display:none;align-items:flex-start;justify-content:center;padding-top:80px;background:rgba(20,16,10,.28)}
.cal-scrim.open{display:flex}
.cal-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 16px 40px -12px rgba(0,0,0,.45);max-width:340px;width:calc(100vw - 32px)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head h3{font-family:"Oswald";text-transform:uppercase;font-size:17px;margin:0;color:var(--ink)}
.cal-head button{width:28px;height:28px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);color:var(--ink2);font-size:14px;display:flex;align-items:center;justify-content:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-dow{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);padding:2px 0;font-weight:700}
.cal-day{aspect-ratio:1;border-radius:8px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid transparent;color:var(--ink2)}
.cal-day.empty{cursor:default}
.cal-day.today{border-color:var(--green);color:var(--ink);background:var(--surface2)}
.cal-day.active{box-shadow:0 0 0 2px var(--gold) inset;color:var(--ink)}
.cal-day.played{background:var(--gold);color:#fff;border-color:var(--gold)}
.cal-day.played.won{background:var(--correct);border-color:var(--correct)}
.cal-day.past:not(.played){border-color:var(--line);color:var(--ink2)}
.cal-day.future{opacity:.25;cursor:default}
.cal-nav{display:flex;justify-content:space-between;margin-top:10px;gap:8px}
.cal-nav button{font-size:12px;font-weight:600;color:var(--green);padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface2)}
.cal-nav button:disabled{opacity:.3;cursor:default}
.scrim{position:fixed;inset:0;background:rgba(20,16,10,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
.scrim.open{display:flex}
.modal{background:var(--surface);border-radius:14px;max-width:380px;width:100%;padding:22px 22px 20px;border:1px solid var(--line);position:relative;max-height:88vh;overflow-y:auto}
.modal-close{position:absolute;top:10px;right:12px;font-size:22px;color:var(--ink2);width:30px;height:30px}

.bar-i{width:12px;font-weight:800;color:var(--ink2);text-align:center}
.bar-wrap{flex:1;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar{background:var(--absent);color:#fff;text-align:right;padding:3px 7px;font-weight:800;font-size:11px;min-width:24px;border-radius:4px}
.bar.win{background:var(--correct)}
.cd{text-align:center;font-size:13px;color:var(--ink2);margin:4px 0 14px}
.cd b{color:var(--ink);font-family:"Oswald";letter-spacing:.05em}
.btn{display:block;width:100%;padding:12px;border-radius:10px;background:var(--green);color:#fff;font-weight:700;font-size:14px;text-align:center;margin-top:8px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink2)}
.btn.share{background:var(--gold);color:#fff;border:1px solid var(--gold)}
.share-msg{text-align:center;font-size:12px;font-weight:800;color:var(--correct);min-height:18px;margin-top:6px;opacity:0;transition:opacity .18s}
.share-msg.on{opacity:1;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.howlist{font-size:13.5px;color:var(--ink2);line-height:1.6}

.swatch{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.sett-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.sett-row:last-child{border-bottom:none;padding-bottom:0}
.sett-label{font-size:14px;color:var(--ink);font-weight:700}
.sett-sub{font-size:11.5px;color:var(--ink2);margin-top:2px;line-height:1.35}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface2);flex:none}
.seg button{font-size:11px;font-weight:800;padding:6px 10px;color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--green);color:#fff}
.cb{--correct:#1a6fc4;--present:#e07b1a;--absent:#555}
[data-theme=dark].cb{--correct:#3a8fe4;--present:#f09030;--absent:#555}
.no-anim .tile.reveal,.no-anim .tile.filled,.no-anim .row.shake,.no-anim .key:active{animation:none!important;transition:none!important}

  var T=t(),g=loadSavedGame("daily",idx)||(idx===DAY_NO?game:null);if(!g||(g.status!=="won"&&g.status!=="lost"))return;
  var oldGame=game;game=g;var won=g.status==="won",isArchive=idx<TODAY_NO;
  var countdownHtml=isArchive?'<div class="cd">'+T.archiveDone+'</div>':'<div class="cd">'+T.next+' <b id="cd">'+countdown()+'</b></div>';
  modal.innerHTML='<button class="modal-close" aria-label="Zamknij">×</button><h2>'+(won?T.endW:T.endL)+'</h2><div class="reveal-card"><div class="reveal-lbl">'+T.revealLbl+'</div><div class="reveal-code" id="revealCode">'+(g.reveal||"····")+'</div></div>'+countdownHtml+'<button class="btn share" id="shareBtn">'+T.share+'</button><div class="share-msg" id="shareMsg" aria-live="polite"></div><button class="btn ghost" id="closeBtn">'+T.again+'</button>';
  scrim.classList.add("open");modal.querySelector(".modal-close").addEventListener("click",closeModal);modal.querySelector("#closeBtn").addEventListener("click",closeModal);modal.querySelector("#shareBtn").addEventListener("click",function(){var text=buildShareText("daily",idx,g);copyShareText(text,function(){showShareMsg(T.copied,true);},function(){showShareMsg(T.copyFail,false);});});
  clearInterval(openEndFor._t);if(!isArchive)openEndFor._t=setInterval(function(){var el=document.getElementById("cd");if(el)el.textContent=countdown();else clearInterval(openEndFor._t);},1000);game=oldGame;
}
function openFinishedModal(delay){if(!game||(game.status!=="won"&&game.status!=="lost"))return;delay=delay===undefined?250:delay;var idx=DAY_NO;setTimeout(function(){openEndFor("daily",idx);},delay);if(game.reveal)return;rpc("klodka_reveal",{p_mode:"daily",p_idx:idx}).then(function(code){var saved=loadSavedGame("daily",idx)||game;if(saved){saved.reveal=code;saveGameFor("daily",idx,saved);}if(game&&DAY_NO===idx){game.reveal=code;saveGameFor("daily",idx,game);}updateRevealInModal(code);}).catch(function(){});}

function openSimpleModal(html){modal.innerHTML='<button class="modal-close" aria-label="Zamknij">×</button>'+html;scrim.classList.add("open");modal.querySelector(".modal-close").addEventListener("click",closeModal);}
function showStats(){var T=t(),hist=hydrateHistory("daily");openSimpleModal('<h2>'+T.statsH+'</h2>'+statsSummaryHtml(hist)+distHtml(hist)+'<button class="btn" id="closeBtn">OK</button>');modal.querySelector("#closeBtn").addEventListener("click",closeModal);}
function showSettings(){
  var T=t();function tog(cur,key){return '<div class="seg"><button data-k="'+key+'" data-v="on" class="seg-opt'+(cur==="on"?' on':'')+'">'+T.settOn+'</button><button data-k="'+key+'" data-v="off" class="seg-opt'+(cur==="off"?' on':'')+'">'+T.settOff+'</button></div>';}
  openSimpleModal('<h2>'+T.settH+'</h2><div class="sett-row"><div><div class="sett-label">'+T.settSoundL+'</div><div class="sett-sub">'+T.settSoundS+'</div></div>'+tog(soundMode,SOUND_KEY)+'</div><div class="sett-row"><div><div class="sett-label">'+T.settAnimL+'</div><div class="sett-sub">'+T.settAnimS+'</div></div>'+tog(animMode,ANIM_KEY)+'</div><div class="sett-row"><div><div class="sett-label">'+T.settCbL+'</div><div class="sett-sub">'+T.settCbS+'</div></div>'+tog(cbMode,CB_KEY)+'</div><div class="sett-row"><div><div class="sett-label">'+T.settDirL+'</div><div class="sett-sub">'+T.settDirS+'</div></div>'+tog(dirMode,DIR_KEY)+'</div><div class="sett-row"><div><div class="sett-label">'+T.settRepeatL+'</div><div class="sett-sub">'+T.settRepeatS+'</div></div>'+tog(repeatMode,REPEAT_KEY)+'</div>');
  modal.querySelectorAll(".seg-opt").forEach(function(btn){btn.addEventListener("click",function(){var k=btn.dataset.k,v=btn.dataset.v;modal.querySelectorAll('.seg-opt[data-k="'+k+'"]').forEach(function(b){b.classList.toggle("on",b.dataset.v===v);});localStorage.setItem(k,v);if(k===SOUND_KEY)soundMode=v;if(k===ANIM_KEY){animMode=v;applyAnimMode();}if(k===CB_KEY){cbMode=v;applyCbMode();}if(k===DIR_KEY){dirMode=v;paintFromGame();}if(k===REPEAT_KEY){repeatMode=v;loadCodeMeta();updateRepeatInfo();}});});
}
function showHelp(){
  try{localStorage.setItem(HELP_KEY,"seen");}catch(e){}
  var T=t();var html='<p>'+T.how+'</p><p style="margin-top:8px"><span class="swatch" style="background:var(--correct)"></span>'+T.lgC+'</p><p><span class="swatch" style="background:var(--present)"></span>'+T.lgP+'</p><p><span class="swatch" style="background:var(--absent)"></span>'+T.lgA+'</p><p style="margin-top:8px">'+T.dirLegend+'</p><p style="margin-top:12px">'+T.optionsInfo+'</p>';
  modal.innerHTML='<button class="modal-close" aria-label="Zamknij">×</button><h2>'+T.howH+'</h2><div class="howlist">'+html+'</div><button class="btn" id="closeBtn" style="margin-top:16px">OK</button>';scrim.classList.add("open");modal.querySelector(".modal-close").addEventListener("click",closeModal);modal.querySelector("#closeBtn").addEventListener("click",closeModal);
}
document.getElementById("statBtn").addEventListener("click",showStats);
document.getElementById("settBtn").addEventListener("click",showSettings);
document.getElementById("helpBtn").addEventListener("click",showHelp);

var calScrim=document.getElementById("calScrim"),calViewYear,calViewMonth;
function loadDailyDay(no){if(no<1||no>TODAY_NO)return;view="daily";DAY_NO=no;current="";loadGame();renderStatic();if(game.status!=="playing")openFinishedModal(250);window.scrollTo(0,0);}
function updateNavBar(){var T=t();document.getElementById("navDayNo").textContent="Kłōdka #"+DAY_NO;document.getElementById("navDayLabel").innerHTML=(DAY_NO===TODAY_NO?T.today:fmtDate(dateOfDayNo(DAY_NO)))+(DAY_NO<TODAY_NO?"<span class='archive-badge'>"+T.archive+"</span>":"");document.getElementById("prevBtn").disabled=DAY_NO<=1;document.getElementById("nextBtn").disabled=DAY_NO>=TODAY_NO;}
document.getElementById("prevBtn").addEventListener("click",function(){loadDailyDay(DAY_NO-1);});
document.getElementById("nextBtn").addEventListener("click",function(){loadDailyDay(DAY_NO+1);});
function openCalendar(){var d=dateOfDayNo(DAY_NO);calViewYear=d.getFullYear();calViewMonth=d.getMonth();renderCalendar();calScrim.classList.add("open");}
function closeCalendar(){calScrim.classList.remove("open");}
document.getElementById("calBtn").addEventListener("click",openCalendar);document.getElementById("calClose").addEventListener("click",closeCalendar);calScrim.addEventListener("click",function(e){if(e.target===calScrim)closeCalendar();});
document.getElementById("calPrev").addEventListener("click",function(){calViewMonth--;if(calViewMonth<0){calViewMonth=11;calViewYear--;}renderCalendar();});
document.getElementById("calNext").addEventListener("click",function(){calViewMonth++;if(calViewMonth>11){calViewMonth=0;calViewYear++;}renderCalendar();});
function renderCalendar(){
  var T=t(),months=["Styczeń","Luty","Marzec","Kwiecień","Maj","Czerwiec","Lipiec","Sierpień","Wrzesień","Październik","Listopad","Grudzień"];
  document.getElementById("calTitle").textContent=T.archive+" · "+months[calViewMonth]+" "+calViewYear;var grid=document.getElementById("calGrid");grid.innerHTML="";
  ["Pn","Wt","Śr","Cz","Pt","Sb","Nd"].forEach(function(d){var el=document.createElement("div");el.className="cal-dow";el.textContent=d;grid.appendChild(el);});
  var first=new Date(calViewYear,calViewMonth,1),dow=(first.getDay()+6)%7;for(var e=0;e<dow;e++){var empty=document.createElement("div");empty.className="cal-day empty";grid.appendChild(empty);}
  var daysInMonth=new Date(calViewYear,calViewMonth+1,0).getDate();for(var d=1;d<=daysInMonth;d++){
    var date=new Date(calViewYear,calViewMonth,d),dayNo=Math.floor((new Date(date.getFullYear(),date.getMonth(),date.getDate())-new Date(EPOCH.getFullYear(),EPOCH.getMonth(),EPOCH.getDate()))/86400000)+1,el=document.createElement("div");el.textContent=d;
    if(dayNo<1||dayNo>TODAY_NO){el.className="cal-day future";grid.appendChild(el);continue;}
    var dg=loadSavedGame("daily",dayNo),cls="cal-day";if(dayNo===TODAY_NO)cls+=" today";else if(dayNo<TODAY_NO)cls+=" past";if(dayNo===DAY_NO)cls+=" active";if(dg&&dg.status==="won")cls+=" played won";else if(dg&&dg.status==="lost")cls+=" played";el.className=cls;(function(no){el.addEventListener("click",function(){closeCalendar();loadDailyDay(no);});})(dayNo);grid.appendChild(el);
  }
  var epochMonth=new Date(EPOCH.getFullYear(),EPOCH.getMonth(),1),curView=new Date(calViewYear,calViewMonth,1),maxDate=dateOfDayNo(TODAY_NO),maxMonth=new Date(maxDate.getFullYear(),maxDate.getMonth(),1);document.getElementById("calPrev").disabled=curView<=epochMonth;document.getElementById("calNext").disabled=curView>=maxMonth;
}

loadGame();renderStatic();
if(game.status!=="playing")openFinishedModal(400);
else if(!localStorage.getItem(HELP_KEY))setTimeout(function(){if(!document.getElementById("scrim").classList.contains("open"))showHelp();},650);
</script>
