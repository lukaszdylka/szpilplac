<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brak połączenia · Szpilplac</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#2f4a39">
<style>
:root{--bg:#f0e8d4;--surface:#fbf7ee;--ink:#23201a;--ink2:#6a6150;--line:#c9bfa6;--green:#2f4a39}
@media(prefers-color-scheme:dark){:root{--bg:#161310;--surface:#262018;--ink:#ede5d0;--ink2:#aaa18d;--line:#3d3629;--green:#4a7a56}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.card{width:min(520px,100%);padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--surface);text-align:center}h1{margin:0 0 10px;font-size:32px}p{margin:0;color:var(--ink2);line-height:1.55}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}a,button{min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:10px 15px;border:0;border-radius:999px;background:var(--green);color:#fff;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.secondary{border:1px solid var(--line);background:transparent;color:var(--ink)}
</style>
</head>
<body>
<main class="card">
  <h1>Brak połączenia</h1>
  <p>Nie udało się pobrać tej strony. Wcześniej odwiedzone gry mogą nadal działać z pamięci urządzenia.</p>
  <div class="actions">
    <button type="button" onclick="location.reload()">Spróbuj ponownie</button>
    <a class="secondary" href="/">Szpilplac</a>
  </div>
</main>
</body>
</html>
